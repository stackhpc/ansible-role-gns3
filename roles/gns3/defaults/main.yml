---
gns3_work_dir: "{{ ansible_env.HOME }}/gns3-work"

gns3_cloud_ports_mapping:
  - interface: breth1
    name: breth1
    port_number: 0
    type: ethernet
  - interface: dummy1
    name: dummy1
    port_number: 1
    type: ethernet
  - interface: enp3s0
    name: enp3s0
    port_number: 2
    type: ethernet
  - interface: virbr0
    name: virbr0
    port_number: 3
    type: ethernet

gns3_links:
  - source_node: "{{ gns3_node_type }}"
    source_adapter: 0
    source_port: 0
    target_node: Cloud
    target_adapter: 0
    target_port: 0

gns3_templates: []