---
- name: Install Expect and Telnet packages
  ansible.builtin.apt:
    name:
      - expect
      - telnet
    state: present

- name: Get switch information
  gns3_node_info:
    project_name: "{{ gns3_project_name }}"
    node_name: "{{ gns3_switch_model }}"
  register: switch

- name: Print switch information
  ansible.builtin.debug:
    msg: "{{ switch }}"

- name: generate host_vars for switch
  ansible.builtin.copy:
    dest: "{{ role_path }}/files/switch1"
    content: |
      ---
      switch_type: dellos10
      ansible_host: {{ management_ip.split('/')[0] }}
      ansible_user: admin
      ansible_ssh_pass: admin
      ansible_connection: ansible.netcommon.network_cli
      ansible_network_os: dellemc.os10.os10

      switch_interface_config:
        ethernet 1/1/1:
          description: "Trial1"
          config:
            - "no shutdown" # doesn't change anything
        ethernet 1/1/2:
          description: "Trial2"
          config:
            - "no shutdown" # doesn't change anything
  when: gns3_integration_mode == "kayobe_physical_network_configuration"

- name: generate host_vars for switch
  ansible.builtin.copy:
    dest: "{{ role_path }}/files/switch1"
    content: |
      ---
      switch_facts_mac: "{{ switch.mac_address }}"
      ansible_host: "192.168.33.10"
      ansible_user: admin
      ansible_ssh_pass: admin
      switch_type: dellos10
  when: gns3_integration_mode == "ngs"

- name: Wait until OS10 has finished booting
  ansible.builtin.command:
    argv:
      - expect
      - "{{ role_path }}/files/wait_for_login.exp"
      - "{{ switch.console_port }}"
  register: bootcheck
  retries: 120
  delay: 5
  until: bootcheck.rc == 0

- name: Give OS10 time to finish booting
  ansible.builtin.pause:
    seconds: "{{ gns3_switch_boot_delay | default(180) }}"

- name: Establish connection to switch
  ansible.builtin.command:
    argv:
      - expect
      - "{{ role_path }}/files/set_admin_connection.exp"
      - "{{ switch.console_port }}"
      - "{{ management_interface }}"
      - "{{ management_ip }}"

- name: Configure switch for NGS
  ansible.builtin.command:
    argv:
      - expect
      - "{{ role_path }}/files/ngs_setup.exp"
      - "{{ switch.console_port }}"
      - "{{ os_controller_interface }}"
      - "{{ baremetal_interface }}"
      - "{{ vlan_tag }}"
  when: gns3_integration_mode == "ngs"
