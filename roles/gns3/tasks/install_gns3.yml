---
- name: Gather Package Facts
  ansible.builtin.package_facts:
    manager: auto

- name: Ensure GNS3 work directory exists
  ansible.builtin.file:
    path: "{{ gns3_work_dir }}"
    state: directory

- name: Download GNS3 Install Script
  ansible.builtin.get_url:
    url: https://raw.githubusercontent.com/GNS3/gns3-server/master/scripts/remote-install.sh
    dest: "{{ gns3_work_dir }}/gns3-remote-install.sh"
    mode: "0755"
  when: "'gns3server' not in ansible_facts.packages"

- name: Install GNS3 Server
  ansible.builtin.shell: ./gns3-remote-install.sh --with-iou --with-i386-repository
  args:
    chdir: "{{ gns3_work_dir }}"
  when: "'gns3server' not in ansible_facts.packages"
