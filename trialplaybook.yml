- hosts: gns3
  become: true
  roles:
    - role: gns3
      vars:
        gns3_project_name: Trial_project
        switch_type: dellos10
        gns3_switch_model: "Dell OS10 S4000-10.5.6.13.327"
        gns3_cloud_ports_mapping: # can do a precheck for values and leave it undefined
        - interface: breth1
          name: breth1
          port_number: 0
          type: ethernet
        - interface: dummy1
          name: dummy1
          port_number: 1
          type: ethernet
        - interface: enp3s0
          name: enp3s0
          port_number: 2
          type: ethernet
        - interface: virbr0
          name: virbr0
          port_number: 3
          type: ethernet
        gns3_switch_boot_delay: 181